<script>

// ---- 保存：この端末（localStorage）＋ Dropbox の「アプリ／マラソンBGM」フォルダ（kanri/data.json） ----
// Dropbox のアプリは マラソンBGM と同じもの。同じサイトの BGM で Dropbox につないでいれば、その許可をそのまま使う。
const DBX_ID='t71484yxymw6ayu',DBX_FILE='/kanri/data.json',TOK='mkanri-dbx-tok',BGM_TOK='cbgm-cloud-tok-dropbox',SYNC='mkanri-sync';
let dirty=false,busy=false,again=false,timer=0,dbReady=false;
const SY=(()=>{try{return JSON.parse(localStorage.getItem(SYNC))||{}}catch(e){return {}}})();

function setSync(t){const e=document.getElementById('sync');if(e)e.textContent=t}
const lsJ=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
function dbxTok(){if(SY.off)return null;const a=lsJ(TOK),b=lsJ(BGM_TOK);const ok=t=>t&&(t.refresh||(t.access&&Date.now()<t.exp-60000));return ok(a)?a:ok(b)?b:null}
const dbxOn=()=>!!dbxTok();
const b64u=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const dbxRedirect=()=>location.origin+location.pathname;
async function dbxSignIn(){const st=b64u(crypto.getRandomValues(new Uint8Array(16))),ver=b64u(crypto.getRandomValues(new Uint8Array(32)));
  const ch=b64u(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(ver)));
  sessionStorage.setItem('mkanri-oauth',JSON.stringify({state:st,ver}));
  location.assign('https://www.dropbox.com/oauth2/authorize?client_id='+DBX_ID+'&response_type=code&redirect_uri='+encodeURIComponent(dbxRedirect())+'&state='+st+'&code_challenge='+ch+'&code_challenge_method=S256&token_access_type=offline')}
async function dbxToken(params){const r=await fetch('https://api.dropboxapi.com/oauth2/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(Object.assign({client_id:DBX_ID},params))});
  if(!r.ok)throw 'auth';const j=await r.json(),old=dbxTok()||{};const t={access:j.access_token,exp:Date.now()+(j.expires_in||3600)*1000,refresh:j.refresh_token||old.refresh||null};localStorage.setItem(TOK,JSON.stringify(t));return t.access}
async function dbxReturn(){let o=null;try{o=JSON.parse(sessionStorage.getItem('mkanri-oauth')||'null')}catch(e){}const q=new URLSearchParams(location.search);
  if(!o||q.get('state')!==o.state)return;sessionStorage.removeItem('mkanri-oauth');history.replaceState(null,'',location.pathname);
  if(q.get('error')||!q.get('code')){tell('Dropboxにつなげませんでした。もう一度「Dropboxにつなぐ」を押してください。');return}
  try{await dbxToken({grant_type:'authorization_code',code:q.get('code'),redirect_uri:dbxRedirect(),code_verifier:o.ver});delete SY.off;sySave();toast('Dropboxにつなぎました')}catch(e){tell('Dropboxにつなげませんでした。もう一度お試しください。')}}
async function dbxAccess(force){const t=dbxTok();if(!t)throw 'auth';if(!force&&t.access&&Date.now()<t.exp-60000)return t.access;if(!t.refresh)throw 'auth';return dbxToken({grant_type:'refresh_token',refresh_token:t.refresh})}
async function dbxFetch(url,opt){let tk=await dbxAccess(false);const go=t=>fetch(url,Object.assign({},opt,{headers:Object.assign({Authorization:'Bearer '+t},opt.headers||{})}));
  let r=await go(tk);if(r.status===401){tk=await dbxAccess(true);r=await go(tk)}return r}
const dbxRpc=(ep,arg)=>dbxFetch('https://api.dropboxapi.com/2/'+ep,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(arg)});
async function dbxGetR(path){const r=await dbxFetch('https://content.dropboxapi.com/2/files/download',{method:'POST',headers:{'Dropbox-API-Arg':JSON.stringify({path})}});if(r.status===409)return null;if(!r.ok)throw r.status;let rev='';try{rev=JSON.parse(r.headers.get('Dropbox-API-Result')||'{}').rev||''}catch(e){}const text=await r.text();if(!rev){try{const mr=await dbxRpc('files/get_metadata',{path});if(mr.ok)rev=(await mr.json()).rev||''}catch(e){}}return {text,rev:rev||('h'+text.length+':'+text.slice(-40))}}
async function dbxGet(path){const r=await dbxFetch('https://content.dropboxapi.com/2/files/download',{method:'POST',headers:{'Dropbox-API-Arg':JSON.stringify({path})}});if(r.status===409)return null;if(!r.ok)throw r.status;return r.text()}
async function dbxPut(path,text,rev){const mode=rev&&rev[0]==='h'?{'.tag':'overwrite'}:rev?{'.tag':'update',update:rev}:{'.tag':'add'};
  const r=await dbxFetch('https://content.dropboxapi.com/2/files/upload',{method:'POST',headers:{'Content-Type':'application/octet-stream','Dropbox-API-Arg':JSON.stringify({path,mode,autorename:false,mute:true})},body:new TextEncoder().encode(text)});
  if(r.status===409)return {conflict:true};if(!r.ok)throw r.status;return r.json()}
function pick3(msg){return new Promise(res=>{const d=$('#dlg2');d.innerHTML='<form method="dialog"><div class="bd">'+esc(msg)+'</div><div class="ft" style="flex-wrap:wrap"><button type="button" class="g" data-p="">あとで決める</button><span style="flex:1"></span><button type="button" class="g" data-p="local">この端末のデータを使う</button><button type="button" class="b" data-p="remote">Dropboxのデータを使う</button></div></form>';
  d.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{d.close();res(b.dataset.p||null)});d.oncancel=()=>res(null);d.showModal()})}
function dataText(){return JSON.stringify({app:'marathon-manager',v:1,saved:new Date().toISOString(),races:S.races,travel:S.travel,train:S.train,meta:S.meta,lists:S.lists,chk:S.chk,web:S.web})}
function useRemote(text,rev){const o=JSON.parse(text);S=normalize({races:o.races,travel:o.travel,train:o.train,meta:o.meta,lists:o.lists,chk:o.chk,web:o.web});try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}SY.rev=rev;dirty=false;SY.dirty=false;sySave();if(!document.querySelector('dialog[open]'))rerender()}
const dbxErr=e=>e==='auth'||e===400||e===401?'Dropboxの許可が切れています（設定でつなぎ直してください）':'同期できません（この端末には保存済み）';
// Dropbox の方が新しいときは取り込み、この端末だけが変わっていれば送る
async function pull(ask0){if(!dbxOn()||busy)return;busy=true;setSync('同期中…');
  try{const m=await dbxGetR(DBX_FILE);
    if(!m){if(S.races.length||S.travel.length||S.train.length){const r=await dbxPut(DBX_FILE,dataText(),null);if(r&&r.rev){SY.rev=r.rev;dirty=false;SY.dirty=false;sySave()}}}
    else if(m.rev!==SY.rev){const text=m.text;
      if(SY.dirty&&SY.rev){busy=false;setSync('');const c=await pick3('Dropboxのデータが、ほかの端末で更新されています。この端末にも、まだDropboxに送っていない変更があります。どちらのデータを使いますか？（使わなかった方の変更は消えます）');busy=true;
        if(c==='remote')useRemote(text,m.rev);else if(c==='local'){const r=await dbxPut(DBX_FILE,dataText(),m.rev);if(r&&r.rev){SY.rev=r.rev;dirty=false;SY.dirty=false;sySave()}}}
      else if(!SY.rev&&(S.races.length||S.travel.length||S.train.length)){busy=false;setSync('');const c=await pick3('Dropboxに大会管理のデータがあります。どちらのデータを使いますか？（使わなかった方のデータは消えます）');busy=true;
        if(c==='remote')useRemote(text,m.rev);else if(c==='local'){const r=await dbxPut(DBX_FILE,dataText(),m.rev);if(r&&r.rev){SY.rev=r.rev;dirty=false;SY.dirty=false;sySave()}}}
      else useRemote(text,m.rev)}
    else if(SY.dirty){busy=false;return push()}
    SY.at=Date.now();sySave();setSync(SY.dirty?'未同期（設定の「今すぐ同期」で選べます）':'同期済み');dbReady=true}
  catch(e){setSync(dbxErr(e))}busy=false;if(again){again=false;push()}}
async function push(){if(!dbxOn())return;if(busy){again=true;return}busy=true;setSync('保存中…');
  try{const r=await dbxPut(DBX_FILE,dataText(),SY.rev||null);
    if(r.conflict){busy=false;if(push.cf){setSync('同期できません（この端末には保存済み）');return}push.cf=true;try{await pull()}finally{push.cf=false}return}
    SY.rev=r.rev;SY.at=Date.now();dirty=false;SY.dirty=false;sySave();setSync('同期済み')}
  catch(e){setSync(dbxErr(e))}busy=false;if(again){again=false;push()}}
async function initSync(){await dbxReturn();if(!dbxOn()){setSync('この端末のみに保存');return}await pull()}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&dbxOn()&&!document.querySelector('dialog[open]')&&Date.now()-(SY.at||0)>20000)pull()});
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}dirty=true;SY.dirty=true;sySave();if(dbxOn()){setSync('保存中…');clearTimeout(timer);timer=setTimeout(push,1500)}}
function dbxCard(){const on=dbxOn(),own=!!lsJ(TOK),t=SY.at?new Date(SY.at):null;
  return '<h2 style="margin-top:0">データの保存先（Dropbox）</h2><div class="card">'+(on?'<div><b>Dropboxにつながっています。</b>'+(own?'':'（マラソンBGMの許可を使っています）')+'</div><div class="note">データはこの端末とDropboxの「アプリ」→ マラソンBGMのフォルダ（kanri/data.json）に自動で保存され、パソコンでもスマートフォンでも同じ内容になります。'+(t?'最後に同期した日時：'+t.getFullYear()+'/'+pad(t.getMonth()+1)+'/'+pad(t.getDate())+' '+pad(t.getHours())+':'+pad(t.getMinutes()):'')+'</div><div class="bar" style="margin:0"><button class="g" id="dxSync">今すぐ同期</button><button class="g" id="dxIn">つなぎ直す</button><button class="d" id="dxOff">この端末でDropboxを使わない</button></div>'
    :'<div><b>この端末だけに保存しています。</b></div><div class="note">Dropboxにつなぐと、パソコンとスマートフォンで同じデータを使え、マラソンBGMの記録もボタン1つで取り込めます。同じ端末のマラソンBGMでDropboxにつないでいれば、自動でつながります。</div><div class="bar" style="margin:0"><button class="b" id="dxIn">Dropboxにつなぐ</button></div>')+'</div>'}
document.addEventListener('click',async e=>{const t=e.target;if(!t.id||!/^dx/.test(t.id))return;
  if(t.id==='dxIn'){if(SY.off&&lsJ(BGM_TOK)){delete SY.off;sySave();await pull();return render()}return dbxSignIn()}

const BGWX=c=>{const L=S.lists.wx||[],pick=a=>a.find(x=>L.includes(x))||'';if(c==null||c==='')return '';if(c<=1)return pick(['晴']);if(c===2)return pick(['晴時々曇','曇']);if(c<=48)return pick(['曇']);if(c>=71&&c<=77||c===85||c===86)return pick(['雪']);return pick(['雨'])};
const BGWXN={'快晴':0,'晴れ':1,'薄曇り':2,'曇り':3,'霧':45,'霧雨':51,'雨':61,'にわか雨':80,'雷雨':95,'雪':71};
const bgNorm=s=>String(s||'').replace(/\s|　|第\d+回|\d{4}|大会/g,'').toLowerCase();
function bgYmd(at){const t=new Date(at);return t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate())}
const BGLAB={net:'ネットタイム',gross:'グロスタイム',res:'完走/リタイア',dnf:'リタイアポイント',photo:'写真URL',rank:'総合順位',erank:'種目別順位',cls:'種目（部門）',wx:'天候',temp:'気温',dist:'実走距離(km)',splits:'スプリット',rmemo:'レースメモ'};
const bgShow=(k,v)=>v==null||v===''?'（空欄）':(k==='net'||k==='gross')?fT(v):String(v).replace(/\n/g,' ／ ');
const bgSec=ms=>Math.round(ms/1000);
function bgHms(v){const m=/^\s*(?:(\d+):)?(\d{1,2}):(\d{2})(?:\.\d+)?\s*$/.exec(String(v||''));return m?(+(m[1]||0))*3600+(+m[2])*60+(+m[3]):null}
const bgKm=k=>{const x=Math.round(k*100)/100;return x+'km'};
function bgSplitsFromLog(rows){const out=[];for(const [km,t] of rows){if(!(km>0)||t==null)continue;const n=Math.round(km/5)*5;if(n>0&&Math.abs(km-n)<0.02&&!out.some(x=>x[0]===n))out.push([n,t])}return out.sort((a,b)=>a[0]-b[0]).map(([k,t])=>bgKm(k)+' '+fT(t)).join('\n')}
// race-○○.json（Dropboxの「アプリ／マラソンBGM」フォルダの記録ファイル）
function bgFromJson(d){if(!d||!d.startAt||(!d.log&&!d.off&&!d.el))return null;const o=d.off||{},F={},L=d.log||[];
  const reach=L.length?+L[L.length-1].km:0,km=+d.km||0;
  const res=d.result==='finish'||d.result==='dnf'?d.result:(km&&reach?(reach>=km-0.05?'finish':'dnf'):'');
  const net=o.net||d.el||0;if(net)F.net=bgSec(net);
  const loss=o.net&&o.gross?o.gross-o.net:(d.waveAt&&d.startAt?Math.max(0,d.startAt-d.waveAt):null);const gross=o.gross||(net&&loss!=null?net+loss:0);if(gross)F.gross=bgSec(gross);
  if(res==='finish')F.res='完走';else if(res==='dnf'){F.res='リタイア';if(reach)F.dnf=(Math.round(reach*10)/10)+'km付近'}
  if(reach)F.dist=Math.round(reach*100)/100;
  if(/^https?:\/\//.test(d.photo||''))F.photo=d.photo;
  if(o.rank)F.rank=+o.rank;if(o.divRank)F.erank=+o.divRank;if(o.div)F.cls=String(o.div);if(o.memo)F.rmemo=String(o.memo);
  const SP=o.splits||{},sk=Object.keys(SP).filter(k=>SP[k]!=null&&+k>0).sort((a,b)=>a-b);
  if(sk.length){const ls=o.basis==='gross'&&loss?loss:0;F.splits=sk.map(k=>bgKm(+k)+' '+fT(bgSec(SP[k]-ls))).join('\n')}
  else{const sp=bgSplitsFromLog(L.map(x=>[+x.km,x.t!=null?bgSec(x.t):null]));if(sp)F.splits=sp}
  try{const C=d.wx&&d.wx.cells;if(C&&C.length){const c=C[0],T=c.time||[];let k=0,b2=1e18;T.forEach((t,i)=>{const x=Math.abs(t-d.startAt);if(x<b2&&c.tc[i]!=null){b2=x;k=i}});const w=BGWX(c.wc[k]);if(w)F.wx=w;if(c.tc[k]!=null)F.temp=Math.round(c.tc[k])}}catch(e){}

  if(kt){const H=kt[0],ik=0,it=H.indexOf('経過'),iw=H.indexOf('天気'),ic=H.indexOf('気温(℃)'),D=kt.slice(1).filter(r=>r[ik]!==''&&!isNaN(parseFloat(r[ik])));

  openForm(isNew?'候補を追加':'候補を編集（'+p.k+' プラン）',[{fields:[['k','記号（a, b, aa など）','s'],['ph','時期','sel',{list:MPH.map(([v,l])=>({v,l}))}],['meal','食事','sel',{list:MMEAL.map(([v,l])=>({v,l}))}],['name','名前','s',{wide:1}],['items','中身（料理）','ta',{wide:1}],['memo','メモ','ta',{wide:1}]]}],rec,
    x=>{x.k=String(x.k||'').trim();if(!x.k||!x.name||!x.ph||!x.meal){tell('記号・時期・食事・名前を入力してください');return false}if(m.plans.some(q=>q.k===x.k&&q!==p)){tell('記号「'+x.k+'」はすでに使われています');return false}
      if(x.ph==='snack')x.meal='s';else if(x.meal==='s'){tell('補食・間食は、時期も「補食・間食」にしてください');return false}
      if(x.ph==='eve'&&x.meal!=='d'){tell('「前日の夕食」の候補は、食事を「夕食」にしてください');return false}
      if(x.ph==='race'&&x.meal!=='b'){tell('「当日の朝食」の候補は、食事を「朝食」にしてください');return false}
      if(!isNew&&x.k!==p.k)for(const id in m.sel)for(const s in m.sel[id])if(m.sel[id][s]===p.k)m.sel[id][s]=x.k;
      if(isNew)m.plans.push(x);else m.plans[m.plans.indexOf(p)]=x},
    isNew?null:()=>{m.plans.splice(m.plans.indexOf(p),1)})}
async function mealAct(id){const m=mealData(),r=S.races.find(x=>x.id===ui.mr);if(!r&&id!=='mealAdd'&&id!=='mealReset')return;
  if(id==='mealFill'){const sel=m.sel[r.id]=m.sel[r.id]||{};let n=0;for(let d=7;d>=0;d--)MSLOT.forEach(([s],si)=>{if(d===0&&s!=='b')return;const k=d+'_'+s;if(sel[k])return;const c=mealFor(m,d,s);if(!c.length)return;sel[k]=c[(d+si)%c.length].k;n++});
    save();render();return toast(n?n+' 欄をおすすめで埋めました':'空欄はありません')}
  if(id==='mealClear'){if(!await ask('この大会の食事メニューをすべて空にします。よろしいですか？'))return;delete m.sel[r.id];delete m.memo[r.id];save();render();return toast('空にしました')}
  if(id==='mealCopy'){const prev=Object.keys(m.sel).map(Number).filter(x=>x!==r.id&&Object.keys(m.sel[x]||{}).length).map(x=>S.races.find(q=>q.id===x)).filter(Boolean).sort((a,b)=>a.d<b.d?1:-1);
    const src=prev.find(q=>q.d<r.d)||prev[0];if(!src)return tell('コピーできる、ほかの大会の食事メニューがありません。');
    if(Object.keys(m.sel[r.id]||{}).length&&!await ask('「'+src.name+'（'+fd(src.d)+'）」のメニューで上書きします。よろしいですか？'))return;
    m.sel[r.id]=JSON.parse(JSON.stringify(m.sel[src.id]));if(m.memo[src.id])m.memo[r.id]=JSON.parse(JSON.stringify(m.memo[src.id]));save();render();return toast('「'+src.name+'」からコピーしました')}
  if(id==='mealPrint')return window.print();
  if(id==='mealAdd')return editMealPlan(null);
  if(id==='mealReset'){if(!await ask('候補の一覧を最初の内容に戻します（追加・編集した候補は消えます）。選んだメニューはそのまま残ります。よろしいですか？'))return;m.plans=mealDefPlans();save();render();return toast('戻しました')}}
document.addEventListener('click',e=>{const t=e.target;if(tab!=='meal')return;if(t.id&&/^meal(Fill|Copy|Clear|Print|Add|Reset)$/.test(t.id)){e.stopPropagation();mealAct(t.id);return}const tr=t.closest('tr[data-mplan]');if(tr){e.stopPropagation();editMealPlan(tr.dataset.mplan)}},true);

  if(t.dataset.mmemo!=null){e.stopPropagation();const m=mealData(),mm=m.memo[ui.mr]=m.memo[ui.mr]||{};if(t.value.trim())mm[t.dataset.mmemo]=t.value.trim();else delete mm[t.dataset.mmemo];save();return toast('保存しました')}},true);

// ---------- today's training menu (dashboard) ----------
const TP_BGM='https://claude.ai/artifact/Led2yd1taWd5FADh4rvrBD';
const TP_NAME={W:'ウォームアップ',J:'ジョグ',P:'ペース走',M:'目標ペース',I:'インターバル',R:'つなぎジョグ',B:'ビルドアップ',L:'ロング走',C:'クールダウン'};
function tpState(){const w=S.web;if(!w.tp||typeof w.tp!=='object')w.tp={};return w.tp}
const tpSec=s=>{const m=/^(\d+):(\d\d)$/.exec(s||'');return m?+m[1]*60+ +m[2]:null};
// メニューの文 → ステージ [記号, ペース秒/km, 距離km]
function tpStages(text,z){
  const S2=[],add=(c,p,km)=>{if(km>0&&p>0)S2.push([c,Math.round(p),Math.round(km*100)/100])};
  if(/休養（|^休養$|本番|🏁/.test(text)&&!/ジョグ/.test(text))return S2;
  let m;
  if((m=/インターバル (\d+)km×(\d+)/.exec(text))){const d=+m[1],n=+m[2],rec=d===1?0.4:0.6;
    add('W',z.jog,2);for(let i=0;i<n;i++){add('I',z.iv,d);if(i<n-1)add('R',z.jog*1.1,rec)}add('C',z.jog,2);return S2}
  if((m=/目標ペース走 (\d+)km/.exec(text))){add('W',z.jog,1.5);add('M',z.mp,+m[1]);add('C',z.jog,1.5);return S2}
  if((m=/ペース走 (\d+)km/.exec(text))){add('W',z.jog,2);add('P',z.th,+m[1]);add('C',z.jog,2);return S2}
  if((m=/ビルドアップ走 (\d+)km（(\d+:\d\d)→(\d+:\d\d)）/.exec(text))){const k=+m[1],a=tpSec(m[2])||z.jog,b=tpSec(m[3])||z.mp;
    add('B',a,k/3);add('B',(a+b)/2,k/3);add('B',b,k/3);return S2}
  if((m=/(\d+)km走（[^、]*、最後の(\d+)kmは目標ペース/.exec(text))){const k=+m[1],p=+m[2];add('L',z.long,k-p);add('M',z.mp,p);return S2}
  if(/ロング走/.test(text)&&(m=/(\d+)km/.exec(text))){add('L',z.long,+m[1]);return S2}
  if((m=/ジョグ (\d+)km（後半(\d+)kmを目標ペース/.exec(text))){const k=+m[1],p=+m[2];add('J',z.jog,k-p);add('M',z.mp,p);return S2}
  if((m=/ジョグ (\d+)km/.exec(text))){add('J',z.jog,+m[1]);return S2}
  return S2}
function tpToday(){
  const ts=plTargets();if(!ts.length)return {none:'これからの大会がないため、今日の練習メニューは作れません。'};
  const tp=tpState(),r=ts.find(x=>x.id===tp.race)||ts[0],bs0=tp.basis!=null?+tp.basis:(+ui.pb||0),st=plStats(r,PL_YEARS[bs0]||1);
  if(!st.D)return {none:'「'+r.name+'」は距離が入っていないため、メニューを作れません。大会一覧で種目を入力してください。'};
  const mode=tp.mode==='time'?'time':'fin',bs=tp.basis!=null?+tp.basis:(+ui.pb||0);
  let P=plBuild(r,st,mode,bs),usedBs=bs;
  if(!P&&!plPre(bs)){P=plBuild(r,st,mode,1);usedBs=1}
  if(!P)return {none:'メニューを作れませんでした。'};
  const td=today(),wk=P.weeks.find(w=>td>=w.ws&&td<=w.we)||P.weeks[0],idx=(new Date(td+'T00:00:00').getDay()+6)%7;
  const day=wk.days.find(d=>d[0]===idx),text=day?day[1]:'休養（練習なし）',stages=day?tpStages(text,P.z):[];
  return {r,ts,mode,P,wk,text,stages,usedBs,days:Math.round((new Date(r.d)-new Date(td))/864e5)}}
function tpRaceLink(r){let b='';try{b=btoa(String.fromCharCode(...new TextEncoder().encode(r.name||''))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}catch(e){}
  return TP_BGM+'#rc.'+r.d.replace(/-/g,'')+'.'+Math.round(dist(r)*1000)+'.'+(Math.round(Number(r.limit))||0)+'.'+b+'.'+tpB64(String(r.cps||'').trim())+(/^(\d{1,2}):(\d\d)$/.test(String(r.start||'').trim())?'.'+String(r.start).trim().replace(/^(\d):/,'0$1:').replace(':',''):'')}
function tpB64(t){try{return btoa(String.fromCharCode(...new TextEncoder().encode(t))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}catch(e){return ''}}
// ---------- マラソンBGMへの一括受け渡し（CSVファイル） ----------
function tpMenuFor(td){const ts=plTargets();if(!ts.length)return null;const tp=tpState(),r=ts.find(x=>x.id===tp.race)||ts[0],bs=tp.basis!=null?+tp.basis:(+ui.pb||0),st=plStats(r,PL_YEARS[bs]||1);if(!st.D)return null;
  const mode=tp.mode==='time'?'time':'fin';let P=plBuild(r,st,mode,bs);if(!P&&!plPre(bs))P=plBuild(r,st,mode,1);if(!P)return null;
  const wk=P.weeks.find(w=>td>=w.ws&&td<=w.we);if(!wk)return null;const idx=(new Date(td+'T00:00:00').getDay()+6)%7,day=wk.days.find(d=>d[0]===idx);
  const text=day?day[1]:'休養（練習なし）',stages=day?tpStages(text,P.z):[];return {text,token:stages.length?tpToken(stages):''}}
const csvQ=v=>{v=String(v==null?'':v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
function tpBulkCsv(){const td=today(),L=[['marathon-bgm-bulk','v1',td].join(','),['種別','日付','名前','距離m','制限秒','スタート','関門','メニュー'].join(',')];
  S.races.filter(r=>r.name&&r.d&&r.d>=td&&!OUT.has(status(r))&&dist(r)).sort((a,b)=>a.d<b.d?-1:1).slice(0,30).forEach(r=>{
    const st=String(r.start||'').trim(),cps=String(r.cps||'').trim().split(/\r?\n/).map(x=>x.trim()).filter(Boolean).join(' / ');
    L.push(['race',r.d,r.name,Math.round(dist(r)*1000),Math.round(Number(r.limit))||0,/^\d{1,2}:\d\d$/.test(st)?st.padStart(5,'0'):'',cps,''].map(csvQ).join(','))});
  for(let i=0;i<7;i++){const d=new Date(td+'T00:00:00');d.setDate(d.getDate()+i);const ds=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),M=tpMenuFor(ds);
    if(M)L.push(['menu',ds,M.text,'','','','',M.token].map(csvQ).join(','))}
  return '\ufeff'+L.join('\r\n')+'\r\n'}
function tpTodayCsv(){const T=tpToday();if(T.none||!T.stages.length)return null;const td=today(),r=T.r,st=String(r.start||'').trim(),cps=String(r.cps||'').trim().split(/\r?\n/).map(x=>x.trim()).filter(Boolean).join(' / ');
  const L=[['marathon-bgm-bulk','v1',td].join(','),['種別','日付','名前','距離m','制限秒','スタート','関門','メニュー'].join(','),
    ['race',r.d,r.name,Math.round(dist(r)*1000),Math.round(Number(r.limit))||0,/^\d{1,2}:\d\d$/.test(st)?st.padStart(5,'0'):'',cps,''].map(csvQ).join(','),
    ['menu',td,T.text,'','','','',tpToken(T.stages)].map(csvQ).join(',')];
  return '\ufeff'+L.join('\r\n')+'\r\n'}
function tpRaceRow(){const ts=plTargets();if(!ts.length)return '';const tp=tpState(),r=ts.find(x=>x.id===tp.race)||ts[0];if(!dist(r))return '';
  return '<div class="tp-race"><span class="muted">一括</span> <button class="g" id="tpBulk" type="button">マラソンBGM用に一括保存（これからの大会＋7日分の練習メニュー）</button></div><div class="tp-race"><span class="muted">本番用</span> <a class="g tp-go" data-link="1" href="'+tpRaceLink(r)+'" target="_blank" rel="noopener">「'+esc(r.name)+'」をマラソンBGMの本番モードで開く</a></div>'}
function tpGoCard(){const ts=plTargets();if(!ts.length)return '';const r=ts[0];if(!dist(r))return '';
  return '<div class="card tp-card tp-mini"><span class="muted">本番用</span> <a class="g tp-go" data-link="1" href="'+tpRaceLink(r)+'" target="_blank" rel="noopener">「'+esc(r.name)+'」をマラソンBGMの本番モードで開く</a></div>'}
function tpToken(stages){return 'tm.'+stages.map(([c,p,km])=>c+p+'x'+Math.max(1,Math.round(km*p/60*10))).join('_')}
const tpMin=([,p,km])=>km*p/60;
function tpCard(){
  if(!plTargets().length)return '';
  const tp=tpState(),td=today(),modeSel='<select id="tpMode"><option value="fin"'+(tp.mode!=='time'?' selected':'')+'>完走重視</option><option value="time"'+(tp.mode==='time'?' selected':'')+'>タイム重視</option></select>';
  if(tp.d!==td||!tp.ans)
    return '<div class="card tp-card"><div class="tp-h">今日の練習メニュー <span class="muted">'+fd(td)+'（'+dow(td)+'）</span></div><div class="tp-q">今日の練習メニューを作成しますか？</div><div class="bar" style="margin:8px 0 0"><label class="tp-l">内容 '+modeSel+'</label><button class="b" id="tpYes">作成する</button><button class="g" id="tpNo">今日は作成しない</button></div>'+tpRaceRow()+'</div>';

  const rows=T.stages.map(s=>'<tr><td>'+TP_NAME[s[0]]+'</td><td class="r">'+fP(s[1])+'/km</td><td class="r">'+fK(s[2])+'km</td><td class="r">'+Math.round(tpMin(s))+'分</td></tr>').join('');

  return '<div class="card tp-card"><div class="tp-h">今日の練習メニュー <span class="muted">'+fd(td)+'（'+dow(td)+'）</span></div>'+
    '<div class="tp-sub">'+esc(T.r.name)+'まで あと<b>'+T.days+'日</b>　'+esc(T.wk.phase)+'　'+(T.mode==='time'?'タイム重視':'完走重視')+(T.usedBs&&!plPre(+ui.pb||0)&&tp.basis==null?'（実績がないため基準「サブ5」で作成）':'')+'</div>'+
    '<div class="tp-text">'+esc(T.text).replace(/(\d+:\d\d)(?!\/km)(?=[）)、→]|$)/g,'$1/km')+'</div>'+
    (T.stages.length?'<div class="tw" style="max-height:none;margin-top:8px"><table><thead><tr><th>ステージ</th><th class="r">ペース</th><th class="r">距離</th><th class="r">時間</th></tr></thead><tbody>'+rows+'<tr><td><b>合計</b></td><td></td><td class="r"><b>'+fK(km)+'km</b></td><td class="r"><b>約'+Math.round(tot)+'分</b></td></tr></tbody></table></div>'
      :'<div class="note">今日は走る練習はありません。体を休めてください。</div>')+
    '<div class="bar" style="margin:10px 0 0">'+go+(T.stages.length?'<button class="g" id="tpCsv" type="button">今日のメニューをCSVで保存</button>':'')+'<label class="tp-l">内容 '+modeSel+'</label>'+raceSel+'<button class="g" id="tpClose">今日は作成しない</button></div>'+
    tpRaceRow()+'</div>'}
{const _vDash=vDash;vDash=function(){return '<style>.tp-card{margin:0 0 14px;border-left:5px solid var(--green)}.tp-h{font-weight:bold;font-size:15px;color:var(--green)}.tp-h .muted{font-weight:normal;font-size:13px}.tp-q{font-size:16px;font-weight:bold;margin-top:4px}.tp-sub{font-size:13px;margin-top:2px}.tp-sub b{font-size:16px}.tp-text{font-size:15px;font-weight:bold;margin-top:6px}.tp-l{display:flex;align-items:center;gap:6px;font-size:13px}.tp-race{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line);font-size:13px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}.tp-mini .tp-race{margin:0;padding:0;border:0}.tp-mini{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 12px}a.tp-go{text-decoration:none;display:inline-block;font-weight:bold}.tp-code{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px}.tp-code input{flex:1 1 160px;min-width:0;font-family:monospace;font-size:13px}</style>'+tpGoCard()+_vDash()}}
